<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生選擇遊戲</title>
<style>
body { font-family: system-ui; background:#f5f6fa; padding:16px; }
button { width:100%; padding:14px; margin:8px 0; font-size:16px; }
.card { background:#fff; padding:16px; border-radius:12px; }
.hidden { display:none; }
</style>
</head>

<body>

<h1>人生選擇遊戲</h1>

<div id="game" class="card">
  <p id="question"></p>
  <button onclick="choose('A')" id="btnA"></button>
  <button onclick="choose('B')" id="btnB"></button>
</div>

<div id="result" class="card hidden">
  <h2 id="outcomeTitle"></h2>
  <p id="outcomeDesc"></p>
  <button onclick="resetGame()">再玩一次</button>
</div>

<script>
let step = 0;

// ✅ 傾向計數（關鍵）
const player = {
  riskTaking: 0,
  riskAvoidance: 0
};

// ✅ 四題選擇（選項不含風險分數，語意清楚）
const questions = [
  {
    q: "Academic Integrity｜學術選擇",
    A: { text: "Use AI / 快快過關", type: "risk" },
    B: { text: "Write yourself / 慢慢打底", type: "avoid" }
  },
  {
    q: "Money｜金錢選擇",
    A: { text: "Speculate / 炒股 Bitcoin", type: "risk" },
    B: { text: "Steady path / 穩定累積", type: "avoid" }
  },
  {
    q: "Social｜人際選擇",
    A: { text: "Party first / 即時連結", type: "risk" },
    B: { text: "Slow build / 慢慢建立", type: "avoid" }
  },
  {
    q: "Romantic｜感情選擇",
    A: { text: "Chase love / 敢愛敢衝", type: "risk" },
    B: { text: "Food first / 穩陣行先", type: "avoid" }
  }
];

function renderQuestion() {
  const q = questions[step];
  document.getElementById("question").innerText = q.q;
  document.getElementById("btnA").innerText = "A｜" + q.A.text;
  document.getElementById("btnB").innerText = "B｜" + q.B.text;
}

function choose(opt) {
  const choice = questions[step][opt];
  if (choice.type === "risk") player.riskTaking++;
  if (choice.type === "avoid") player.riskAvoidance++;

  step++;
  if (step < questions.length) {
    renderQuestion();
  } else {
    showOutcome();
  }
}

function showOutcome() {
  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  let title = "";
  let desc = "";

  // ✅ Outcome 判定（一定會出現 Fortress Keeper）
  if (player.riskAvoidance === 4) {
    title = "Fortress Keeper｜高牆防守者";
    desc = "你極度重視安全與控制，在出發前築起完整防線。";
  } else if (player.riskAvoidance === 3) {
    title = "Security Seeker｜安全至上派";
    desc = "你優先確保穩定與可預測性，避免不確定風險。";
  } else if (player.riskAvoidance === 2) {
    title = "Grounded Builder｜慢工起樓者";
    desc = "你相信穩固基礎，願意慢慢累積長期成果。";
  } else if (player.riskTaking === 2 && player.riskAvoidance >= 1) {
    title = "Balancer｜走鋼線者";
    desc = "你在冒險與穩定之間不斷權衡。";
  } else if (player.riskTaking === 2) {
    title = "Opportunistic Sprinter｜快手博位者";
    desc = "你擅長把握機會，但需要留意消耗。";
  } else {
    title = "Drifter｜豪賭型探索者";
    desc = "你選擇速度與刺激，相信人生要全情投入。";
  }

  document.getElementById("outcomeTitle").innerText = title;
  document.getElementById("outcomeDesc").innerText = desc;
}

function resetGame() {
  step = 0;
  player.riskTaking = 0;
  player.riskAvoidance = 0;
  document.getElementById("game").classList.remove("hidden");
  document.getElementById("result").classList.add("hidden");
  renderQuestion();
}

// 啟動
renderQuestion();
</script>

</body>
</html>
