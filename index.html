
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>人生棋盤遊戲</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  background: #f5f6fa;
  margin: 0;
  padding: 12px;
  text-align: center;
}
h1 { margin: 8px 0; }

.panel {
  background: #fff;
  border-radius: 14px;
  padding: 14px;
  margin: 10px auto;
  max-width: 420px;
}

.big { font-size: 20px; font-weight: bold; }

button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  font-size: 18px;
  border-radius: 12px;
  border: none;
  background: #4a69bd;
  color: white;
}

.choiceBtn { background: #1e3799; }

.hidden { display: none; }

#timeline {
  text-align: left;
  font-size: 14px;
  max-height: 220px;
  overflow-y: auto;
}

.timeline-item {
  border-left: 5px solid #aaa;
  padding-left: 10px;
  margin-bottom: 8px;
}

.milestone-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.milestone-card {
  background: #fff;
  padding: 28px;
  border-radius: 20px;
  text-align: center;
  animation: pop 0.5s ease;
}

@keyframes pop {
  from { transform: scale(0.85); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.archetype-card {
  border-radius: 18px;
  padding: 26px;
  color: white;
}

.archetype-emoji { font-size: 48px; }
.reflection { margin-top: 14px; font-size: 14px; opacity: 0.95; }
</style>
</head>

<body>

<h1>人生棋盤遊戲</h1>

<div class="panel">
  <div class="big">位置：<span id="pos">0</span> / 50</div>
  <div class="big">金幣：<span id="coins">20</span></div>
  <button onclick="rollDice()">🎲 擲骰</button>
</div>

<div id="choicePanel" class="panel hidden">
  <div id="question" class="big"></div>
  <button class="choiceBtn" onclick="choose('A')" id="choiceA"></button>
  <button class="choiceBtn" onclick="choose('B')" id="choiceB"></button>
</div>

<div class="panel">
  <h3>人生時間線</h3>
  <div id="timeline"></div>
</div>

<div id="endingCard" class="panel hidden">
  <div id="endingInner" class="archetype-card">
    <div class="archetype-emoji" id="cardEmoji"></div>
    <h2 id="cardTitle"></h2>
    <p id="cardSummary"></p>
    <div class="reflection" id="cardReflection"></div>
    <button onclick="resetGame()">再玩一次</button>
  </div>
</div>

<div id="milestoneAnim" class="milestone-overlay hidden">
  <div class="milestone-card">
    <div style="font-size:46px;">🌟</div>
    <div class="big">人生關鍵時刻</div>
  </div>
</div>

<script>
/* ========= 玩家 ========= */
let player = {
  position: 0,
  coins: 20,
  history: [],
  tags: {},
  triggeredMilestones: []
};

/* ========= 關鍵格 ========= */
const milestones = [
  { pos: 8,  qid: "Q1" },
  { pos: 18, qid: "Q2" },
  { pos: 30, qid: "Q3" },
  { pos: 42, qid: "Q4" }
];

/* ========= 選擇題 ========= */
const choices = {
  Q1: {
    q: "Academic Integrity｜學術誠信",
    A: { text: "Use AI / Copy Paste", tag: "FAST", coins: 6 },
    B: { text: "Write Yourself", tag: "STEADY", coins: 6 }
  },
  Q2: {
    q: "Money｜金錢選擇",
    A: { text: "Speculate / Bitcoin", tag: "RISK", coins: 8 },
    B: { text: "Steady Path", tag: "STEADY", coins: 6 }
  },
  Q3: {
    q: "Study vs Social｜讀書定社交？",
    A: { text: "Party First", tag: "SOCIAL", coins: 6 },
    B: { text: "Study First", tag: "STEADY", coins: 6 }
  },
  Q4: {
    q: "Romantic Dilemma｜感情抉擇",
    A: { text: "Chase Love", tag: "BALANCE", coins: 6 },
    B: { text: "Friendship First", tag: "SAFE", coins: 6 }
  }
};

/* ========= Archetype ========= */
const archetypes = {
  FAST: { title:"Fast Track Survivor", emoji:"⚡", color:"#c0392b",
    summary:"短期效率高，但代價潛伏。",
    reflection:"如果慢一點，會發現什麼？" },
  RISK: { title:"Risk Rider", emoji:"🎢", color:"#e67e22",
    summary:"追求刺激，擁抱不確定。",
    reflection:"你準備好承受後果嗎？" },
  SOCIAL:{ title:"Social Connector", emoji:"🤝", color:"#2980b9",
    summary:"關係優先，人脈即力量。",
    reflection:"關係的代價你看見了嗎？" },
  STEADY:{ title:"Steady Builder", emoji:"🧱", color:"#27ae60",
    summary:"慢慢累積，重視基礎。",
    reflection:"世界加速時你守得住嗎？" },
  BALANCE:{ title:"Brave Balancer", emoji:"❤️", color:"#8e44ad",
    summary:"成長與愛並行。",
    reflection:"你願意為平衡付出什麼？" },
  SAFE:{ title:"Safe Keeper", emoji:"🛡️", color:"#16a085",
    summary:"守住重要的人。",
    reflection:"有一天會想冒險嗎？" }
};

/* ========= 擲骰（已修正，不漏事件） ========= */
function rollDice() {
  if (player.position >= 50) return;

  const prev = player.position;
  const dice = Math.floor(Math.random()*6)+1;
  player.position = Math.min(50, player.position + dice);
  updateUI();

  const crossed = milestones.filter(m =>
    prev < m.pos &&
    player.position >= m.pos &&
    !player.triggeredMilestones.includes(m.pos)
  );

  if (crossed.length > 0) {
    const m = crossed[0];
    player.triggeredMilestones.push(m.pos);
    showMilestoneAnim(() => showChoice(m.qid));
    return;
  }

  const change = Math.floor(Math.random()*5)-2;
  player.coins += change;
  log(`第 ${player.position} 格：普通事件（金幣 ${change>=0?"+":""}${change}）`, "STEADY");
  updateUI();

  if (player.position >= 50) showEndingCard();
}

/* ========= 選擇 ========= */
function showChoice(qid){
  const q = choices[qid];
  document.getElementById("question").innerText = q.q;
  document.getElementById("choiceA").innerText = "A. " + q.A.text;
  document.getElementById("choiceB").innerText = "B. " + q.B.text;
  document.getElementById("choicePanel").dataset.qid = qid;
  document.getElementById("choicePanel").classList.remove("hidden");
}

function choose(opt){
  const qid = document.getElementById("choicePanel").dataset.qid;
  const c = choices[qid][opt];
  player.coins += c.coins;
  player.tags[c.tag] = (player.tags[c.tag]||0)+1;
  log(`人生選擇：${choices[qid].q} → ${c.text}`, c.tag);
  document.getElementById("choicePanel").classList.add("hidden");
  updateUI();
}

/* ========= 時間線 ========= */
function log(text, tag){
  player.history.push({text, tag});
  const t = document.getElementById("timeline");
  const d = document.createElement("div");
  d.className = "timeline-item";
  d.style.borderColor = archetypes[tag]?.color || "#999";
  d.innerText = text;
  t.appendChild(d);
}

/* ========= 動畫 ========= */
function showMilestoneAnim(cb){
  const el = document.getElementById("milestoneAnim");
  el.classList.remove("hidden");
  setTimeout(()=>{
    el.classList.add("hidden");
    cb();
  },900);
}

/* ========= 結尾 ========= */
function showEndingCard(){
  let top="STEADY", max=0;
  for (let k in player.tags){
    if (player.tags[k]>max){ max=player.tags[k]; top=k; }
  }
  const a = archetypes[top];
  document.getElementById("endingInner").style.background = a.color;
  cardEmoji.innerText = a.emoji;
  cardTitle.innerText = a.title;
  cardSummary.innerText = a.summary;
  cardReflection.innerText = a.reflection;
  document.getElementById("endingCard").classList.remove("hidden");
}

/* ========= UI ========= */
function updateUI(){
  pos.innerText = player.position;
  coins.innerText = player.coins;
}

function resetGame(){
  location.reload();
}
</script>

</body>
</html>
