<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>人生棋盤遊戲</title>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: #f5f6fa;
      margin: 0;
      padding: 12px;
      text-align: center;
    }
    h1 { margin-top: 8px; }

    .panel {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      margin: 10px auto;
      max-width: 420px;
    }

    .big { font-size: 20px; font-weight: bold; }

    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      font-size: 18px;
      border-radius: 12px;
      border: none;
      background: #4a69bd;
      color: #fff;
    }

    .choiceBtn { background: #1e3799; }

    .hidden { display: none; }

    #timeline {
      text-align: left;
      font-size: 14px;
      max-height: 220px;
      overflow-y: auto;
    }

    .timeline-item {
      border-left: 5px solid #aaa;
      padding-left: 10px;
      margin-bottom: 8px;
    }

    .archetype-card {
      border-radius: 18px;
      padding: 24px;
      color: white;
      text-align: center;
    }

    .archetype-emoji {
      font-size: 48px;
      margin-bottom: 8px;
    }

    .reflection {
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.95;
    }
  </style>
</head>

<body>

<h1>人生棋盤遊戲</h1>

<div class="panel">
  <div class="big">位置：<span id="pos">0</span> / 50</div>
  <div class="big">金幣：<span id="coins">20</span></div>
  <button onclick="rollDice()">擲骰</button>
</div>

<div id="choicePanel" class="panel hidden">
  <div id="question" class="big"></div>
  <button class="choiceBtn" onclick="choose('A')" id="choiceA"></button>
  <button class="choiceBtn" onclick="choose('B')" id="choiceB"></button>
</div>

<div class="panel">
  <h3>人生時間線</h3>
  <div id="timeline"></div>
</div>

<div id="endingCard" class="panel hidden">
  <div id="endingInner" class="archetype-card">
    <div class="archetype-emoji" id="cardEmoji"></div>
    <h2 id="cardTitle"></h2>
    <p id="cardSummary"></p>
    <div class="reflection" id="cardReflection"></div>
    <button onclick="resetGame()">再玩一次</button>
  </div>
</div>

<script>
/* =====================
   玩家狀態
===================== */
const player = {
  position: 0,
  coins: 20,
  history: [],
  tags: {},
  triggeredMilestones: []
};

/* =====================
   關鍵格（跨越觸發）
===================== */
const milestones = [
  { pos: 8,  qid: 'Q1' },
  { pos: 18, qid: 'Q2' },
  { pos: 30, qid: 'Q3' },
  { pos: 42, qid: 'Q4' }
];

/* =====================
   人生選擇題
===================== */
const choices = {
  Q1: {
    q: 'Academic Integrity｜學術誠信',
    A: { text: 'Use AI / Copy Paste（快快過關）', coins: 6, tag: 'FAST' },
    B: { text: 'Write Yourself（慢慢打底）', coins: 6, tag: 'STEADY' }
  },
  Q2: {
    q: 'Money｜金錢選擇',
    A: { text: 'Speculate 炒股 / Bitcoin', coins: 8, tag: 'RISK' },
    B: { text: 'Steady Path 穩定累積', coins: 6, tag: 'STEADY' }
  },
  Q3: {
    q: 'Study vs Social｜讀書定社交？',
    A: { text: 'Party First 人緣行先', coins: 6, tag: 'SOCIAL' },
    B: { text: 'Study First 專注進度', coins: 6, tag: 'STEADY' }
  },
  Q4: {
    q: 'Romantic Dilemma｜感情抉擇',
    A: { text: 'Chase Love 敢愛衝', coins: 6, tag: 'BALANCE' },
    B: { text: 'Friendship First 穩陣守', coins: 6, tag: 'SAFE' }
  }
};

/* =====================
   Archetypes
===================== */
const archetypes = {
  FAST: { emoji:'⚡', color:'#c0392b', title:'Fast Track Survivor', summary:'短期效率高，代價潛伏。', reflect:'如果慢一點，會看到什麼？' },
  RISK: { emoji:'🎢', color:'#e67e22', title:'Risk Rider', summary:'擁抱刺激與不確定。', reflect:'你準備好承受後果嗎？' },
  SOCIAL:{ emoji:'🤝', color:'#2980b9', title:'Social Connector', summary:'關係是你的力量。', reflect:'關係的代價是什麼？' },
  STEADY:{ emoji:'🧱', color:'#27ae60', title:'Steady Builder', summary:'慢慢累積，重視基礎。', reflect:'世界加速時你守得住嗎？' },
  BALANCE:{ emoji:'⚖️', color:'#8e44ad', title:'Brave Balancer', summary:'成長與愛並行。', reflect:'你正在平衡什麼？' },
  SAFE:{ emoji:'🛡️', color:'#16a085', title:'Safe Keeper', summary:'守住最重要的人。', reflect:'有一天你會踏出一步嗎？' }
};

/* =====================
   擲骰（跨越判斷）
===================== */
function rollDice() {
  if (player.position >= 50) return;

  const prev = player.position;
  const dice = Math.floor(Math.random() * 6) + 1;
  player.position = Math.min(50, player.position + dice);
  updateUI();

  const crossed = milestones.filter(m =>
    prev < m.pos &&
    player.position >= m.pos &&
    !player.triggeredMilestones.includes(m.pos)
  );

  if (crossed.length > 0) {
    const m = crossed[0];
    player.triggeredMilestones.push(m.pos);
    showChoice(m.qid);
    return;
  }

  const change = Math.floor(Math.random() * 5) - 2;
  player.coins += change;
  logEvent(`前進到 ${player.position}｜金幣 ${change >= 0 ? '+' : ''}${change}`, 'STEADY');
  updateUI();

  if (player.position >= 50) showEndingCard();
}

/* =====================
   人生選擇
===================== */
function showChoice(qid) {
  const q = choices[qid];
  document.getElementById('question').innerText = q.q;
  document.getElementById('choiceA').innerText = 'A. ' + q.A.text;
  document.getElementById('choiceB').innerText = 'B. ' + q.B.text;
  document.getElementById('choicePanel').dataset.qid = qid;
  document.getElementById('choicePanel').classList.remove('hidden');
}

function choose(opt) {
  const qid = document.getElementById('choicePanel').dataset.qid;
  const c = choices[qid][opt];
  player.coins += c.coins;
  player.tags[c.tag] = (player.tags[c.tag] || 0) + 1;
  logEvent(`${choices[qid].q} → ${c.text}`, c.tag);
  document.getElementById('choicePanel').classList.add('hidden');
  updateUI();
}

/* =====================
   時間線
===================== */
function logEvent(text, tag) {
  const div = document.createElement('div');
  div.className = 'timeline-item';
  div.style.borderColor = archetypes[tag]?.color || '#aaa';
  div.innerText = text;
  document.getElementById('timeline').appendChild(div);
}

/* =====================
   結尾
===================== */
function showEndingCard() {
  let top = 'STEADY', max = 0;
  for (const k in player.tags) {
    if (player.tags[k] > max) { max = player.tags[k]; top = k; }
  }
  const a = archetypes[top];
  document.getElementById('endingInner').style.background = a.color;
  document.getElementById('cardEmoji').innerText = a.emoji;
  document.getElementById('cardTitle').innerText = a.title;
  document.getElementById('cardSummary').innerText = a.summary;
  document.getElementById('cardReflection').innerText = a.reflect;
  document.getElementById('endingCard').classList.remove('hidden');
}

/* =====================
   UI
===================== */
function updateUI() {
  document.getElementById('pos').innerText = player.position;
  document.getElementById('coins').innerText = player.coins;
}

function resetGame() {
  location.reload();
}
</script>

</body>
</html>
